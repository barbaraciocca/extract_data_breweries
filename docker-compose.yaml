x-airflow-common:
  &airflow-common
  build: .   # usa Dockerfile da mesma pasta
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    PYTHONPATH: /opt/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

  volumes:
    - ./dags:/opt/airflow/dags
    - ./tasks:/opt/airflow/tasks
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./minio-data:/opt/airflow/minio-data

  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ---------------- POSTGRES ----------------
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    restart: always

  # ---------------- REDIS ----------------
  redis:
    image: redis:7.2-bookworm
    restart: always

  # ---------------- MINIO ----------------
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    restart: always

  # ---------------- AIRFLOW INIT ----------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com

        echo "Criando conexão MINIO_S3..."

        airflow connections add MINIO_S3 \
          --conn-type aws \
          --conn-login minioadmin \
          --conn-password minioadmin \
          --conn-extra '{"endpoint_url": "http://minio:9000"}'

    user: "0:0"
    depends_on:
      - postgres
      - redis
      - minio

  # ---------------- AIRFLOW WEBSERVER ----------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    restart: always

  # ---------------- AIRFLOW SCHEDULER ----------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init
    restart: always

  # ---------------- AIRFLOW WORKER ----------------
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on:
      - airflow-init
    restart: always

volumes:
  postgres-db-volume:
